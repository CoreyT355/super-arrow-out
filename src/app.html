<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- PWA manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- iOS home-screen app support -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Arrow Out" />
		<!-- Versioned filename (.v2) busts CDN/HTTP caches so NEW home-screen
		     installs pick up the current icon. Note: iOS never re-reads this
		     for an already-saved shortcut — existing installs keep the old
		     icon until the user removes and re-adds the site. -->
		<link rel="apple-touch-icon" href="/icon-192.v2.png" />

		<!-- Theme colour for Android Chrome's browser chrome -->
		<meta name="theme-color" content="#0f172a" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
