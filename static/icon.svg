<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <!-- Grid dots (3×3) suggesting the puzzle grid -->
  <g fill="#1e3a5f" opacity="0.6">
    <rect x="80"  y="80"  width="100" height="100" rx="18"/>
    <rect x="206" y="80"  width="100" height="100" rx="18"/>
    <rect x="332" y="80"  width="100" height="100" rx="18"/>
    <rect x="80"  y="206" width="100" height="100" rx="18"/>
    <rect x="206" y="206" width="100" height="100" rx="18"/>
    <rect x="332" y="206" width="100" height="100" rx="18"/>
    <rect x="80"  y="332" width="100" height="100" rx="18"/>
    <rect x="206" y="332" width="100" height="100" rx="18"/>
    <rect x="332" y="332" width="100" height="100" rx="18"/>
  </g>
  <!-- Arrow snake: body -->
  <polyline
    points="130,256 256,256 256,130"
    fill="none" stroke="#38bdf8" stroke-width="44"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head pointing up (exiting top) -->
  <polygon points="256,56 216,120 296,120" fill="#38bdf8"/>
</svg>
